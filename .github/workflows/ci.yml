name: Workspace checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-and-privacy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/privacy_check.py
      - run: python tools/check_skills.py
      - run: python -m unittest discover -s tests -t . -q
  portal-clis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Typecheck and run offline tests for every portal
        env:
          JOB_SEARCH_LIVE_TESTS: '0'
        run: |
          set -euo pipefail
          for manifest in .agents/skills/*/cli/package.json; do
            (
              cd "$(dirname "$manifest")"
              bun install
              bun run typecheck
              bun test
            )
          done
  latex-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install stock template engines and PDF utilities
        run: sudo apt-get update && sudo apt-get install -y texlive-luatex texlive-xetex texlive-latex-extra texlive-fonts-extra texlive-lang-english poppler-utils
      - run: python tools/smoke_templates.py
